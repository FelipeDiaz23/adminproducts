<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de catálogo — SKU + fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#EEF0EC; --panel:#FFFFFF; --panel-2:#F5F5F2; --sidebar:#1E211D; --sidebar-2:#282C26;
    --border:#D6D8D2; --text:#211E19; --muted:#666359;
    --accent:#BE611E; --accent-ink:#7C3D0F; --accent-soft:#F3DEC7;
    --teal:#1E6F63; --teal-soft:#D9EEEA; --danger:#AE3A26; --danger-soft:#F6DCD5;
    --radius:10px;
    --sans:'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141517; --panel:#1D1E21; --panel-2:#25262A; --sidebar:#101113; --sidebar-2:#1A1B1E;
      --border:#34363B; --text:#ECEDEE; --muted:#9EA1A6;
      --accent:#E28A44; --accent-ink:#FFD9B0; --accent-soft:#3E2C18;
      --teal:#5BC3B1; --teal-soft:#17302B; --danger:#E2695A; --danger-soft:#3B221D;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans);}
  button{font-family:var(--sans); cursor:pointer; border-radius:7px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:8px 12px; font-size:0.8rem;}
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  button.primary:hover{filter:brightness(1.06);}
  button.wide{width:100%;}
  select, input[type=text]{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:var(--panel-2); color:var(--text); font-family:var(--sans); font-size:0.83rem;}
  label.field-label{display:block; font-size:0.7rem; color:var(--muted); margin:8px 0 4px;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:246px; flex-shrink:0; background:var(--sidebar); color:#EDEEEC; display:flex; flex-direction:column;
    padding:18px 14px; gap:16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{font-weight:700; font-size:1.02rem; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; padding:0 4px;}
  .side-block{background:var(--sidebar-2); border-radius:99px; border-radius:9px; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .side-block h3{margin:0; font-size:0.7rem; text-transform:uppercase; letter-spacing:.04em; color:#9EA19B; font-weight:600;}
  .side-block .hint{font-size:0.68rem; color:#9EA19B; line-height:1.35; margin:0;}
  .file-drop{
    border:1.3px dashed #454940; border-radius:8px; padding:10px; text-align:center; font-size:0.76rem; color:#C7C9C4; cursor:pointer; background:#00000022; display:block;
  }
  .file-drop:hover{border-color:var(--accent); color:#fff;}
  .file-drop input{display:none;}
  .file-drop .fname{display:block; margin-top:4px; font-family:var(--mono); font-size:0.66rem; color:var(--accent-ink); word-break:break-all;}
  .sidebar select{background:#00000022; color:#EDEEEC; border-color:#454940;}

  .main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{padding:16px clamp(14px,3vw,28px); border-bottom:1px solid var(--border); background:var(--panel);}
  .topbar h1{margin:0; font-size:1.15rem; font-weight:700;}
  .content{padding:20px clamp(14px,3vw,28px); flex:1;}

  .cards-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .stat-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .stat-card .num{font-family:var(--mono); font-size:1.5rem; font-weight:600;}
  .stat-card .lbl{font-size:0.74rem; color:var(--muted); margin-top:2px;}
  
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .photo{aspect-ratio:1/1; background:var(--panel-2); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .photo img{width:100%; height:100%; object-fit:cover;}
  .card-body{padding:12px; display:flex; flex-direction:column; gap:6px;}
  .sku{font-family:var(--mono); font-size:0.75rem; color:var(--accent); font-weight:600;}
  .title{font-size:0.85rem; font-weight:600; margin:0;}
  .price{font-size:0.8rem; color:var(--muted);}

  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:0.8rem; opacity:0; pointer-events:none; transition:0.2s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">📦 Panel de Catálogo</div>

    <div class="side-block">
      <h3>1 · Archivo Excel / CSV</h3>
      <label class="file-drop">
        <input type="file" id="excelInput" accept=".xlsx,.xls,.csv">
        📄 Cargar Excel
        <span class="fname" id="excelName"></span>
      </label>
      <div id="excelCols" style="display:none;">
        <label class="field-label">Columna SKU</label>
        <select id="skuCol"></select>
        <label class="field-label">Columna Nombre</label>
        <select id="nameCol"></select>
        <label class="field-label">Columna Precio</label>
        <select id="priceCol"></select>
      </div>
    </div>

    <div class="side-block">
      <h3>2 · Fotos</h3>
      <p class="hint">El nombre de la foto debe ser igual al SKU.</p>
      <label class="file-drop">
        <input type="file" id="photosInput" accept="image/*" multiple>
        🖼️ Cargar Fotos
        <span class="fname" id="photosName"></span>
      </label>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <h1>Resumen de Productos</h1>
    </div>

    <div class="content">
      <div class="cards-row">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total Productos</div></div>
        <div class="stat-card"><div class="num" id="statConFoto" style="color:var(--teal);">0</div><div class="lbl">Con foto</div></div>
        <div class="stat-card"><div class="num" id="statSinFoto" style="color:var(--danger);">0</div><div class="lbl">Sin foto</div></div>
      </div>

      <div class="grid" id="catalogGrid">
        <p style="color:var(--muted);">Carga un archivo Excel para mostrar el catálogo.</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  let excelRows = [], excelHeaders = [];
  let skuColIndex = 0, nameColIndex = 1, priceColIndex = 2;
  let loadedImages = new Map();
  let items = [];

  function showToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("excelInput").addEventListener("change", handleExcel);
    document.getElementById("photosInput").addEventListener("change", handlePhotos);
    
    document.getElementById("skuCol").addEventListener("change", (e) => { skuColIndex = parseInt(e.target.value); processCatalog(); });
    document.getElementById("nameCol").addEventListener("change", (e) => { nameColIndex = parseInt(e.target.value); processCatalog(); });
    document.getElementById("priceCol").addEventListener("change", (e) => { priceColIndex = parseInt(e.target.value); processCatalog(); });
  });

  function handleExcel(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("excelName").textContent = file.name;
    const reader = new FileReader();

    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawAOA = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        if (!rawAOA.length) {
          showToast("El Excel está vacío");
          return;
        }

        excelHeaders = rawAOA[0] || [];
        excelRows = rawAOA.slice(1);

        populateSelectors();
        processCatalog();
        showToast("Excel cargado correctamente");
      } catch (err) {
        console.error(err);
        showToast("Error al procesar el Excel");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function populateSelectors() {
    const skuSel = document.getElementById("skuCol");
    const nameSel = document.getElementById("nameCol");
    const priceSel = document.getElementById("priceCol");

    [skuSel, nameSel, priceSel].forEach(s => s.innerHTML = "");

    excelHeaders.forEach((h, i) => {
      const optText = h ? String(h) : `Columna ${i + 1}`;
      [skuSel, nameSel, priceSel].forEach(s => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = optText;
        s.appendChild(opt);
      });
    });

    excelHeaders.forEach((h, i) => {
      const name = String(h).toLowerCase();
      if (name.includes("sku") || name.includes("codigo") || name.includes("código")) skuSel.value = i;
      if (name.includes("nombre") || name.includes("producto") || name.includes("descripcion")) nameSel.value = i;
      if (name.includes("precio") || name.includes("price") || name.includes("costo")) priceSel.value = i;
    });

    skuColIndex = parseInt(skuSel.value);
    nameColIndex = parseInt(nameSel.value);
    priceColIndex = parseInt(priceSel.value);

    document.getElementById("excelCols").style.display = "block";
  }

  function handlePhotos(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    document.getElementById("photosName").textContent = `${files.length} fotos listas`;

    files.forEach(file => {
      const cleanName = file.name.split('.')[0].trim().toLowerCase();
      const url = URL.createObjectURL(file);
      loadedImages.set(cleanName, url);
    });

    processCatalog();
    showToast("Fotos vinculadas");
  }

  function processCatalog() {
    items = [];
    let conFoto = 0;

    excelRows.forEach(row => {
      const sku = row[skuColIndex] ? String(row[skuColIndex]).trim() : "";
      if (!sku) return;

      const nombre = row[nameColIndex] ? String(row[nameColIndex]).trim() : "Sin Nombre";
      const precio = row[priceColIndex] ? String(row[priceColIndex]).trim() : "0";
      
      const imgUrl = loadedImages.get(sku.toLowerCase()) || null;
      if (imgUrl) conFoto++;

      items.push({ sku, nombre, precio, imgUrl });
    });

    document.getElementById("statTotal").textContent = items.length;
    document.getElementById("statConFoto").textContent = conFoto;
    document.getElementById("statSinFoto").textContent = items.length - conFoto;

    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById("catalogGrid");
    grid.innerHTML = "";

    if (!items.length) {
      grid.innerHTML = '<p style="color:var(--muted);">No hay productos para mostrar.</p>';
      return;
    }

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="photo">
          ${item.imgUrl ? `<img src="${item.imgUrl}" alt="${item.sku}">` : '<span style="color:var(--muted); font-size:0.75rem;">Sin Foto</span>'}
        </div>
        <div class="card-body">
          <span class="sku">${item.sku}</span>
          <h4 class="title">${item.nombre}</h4>
          <span class="price">$ ${item.precio}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

})();
</script>

</body>
</html>
